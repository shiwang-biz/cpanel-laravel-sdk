<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cPanel Laravel SDK logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="0.55" stop-color="#FF2D20"/>
      <stop offset="1" stop-color="#A8130B"/>
    </linearGradient>

    <radialGradient id="gloss" cx="0.32" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBD3DE"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F5F8"/>
      <stop offset="1" stop-color="#B9C2CF"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7EAEF"/>
      <stop offset="1" stop-color="#A6AFBD"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b0d08" flood-opacity="0.45"/>
    </filter>
    <filter id="barShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a0705" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app-icon backdrop -->
  <rect x="8" y="8" width="224" height="224" rx="54" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="9" y="9" width="222" height="110" rx="53" fill="url(#edge)" opacity="0.5"/>
  <rect x="8" y="8" width="224" height="224" rx="54" fill="url(#gloss)"/>

  <!-- stacked server / control-panel bars, each beveled for a 3D feel -->
  <g filter="url(#barShadow)">
    <rect x="58" y="66" width="124" height="32" rx="9" fill="url(#bar1)"/>
    <rect x="58" y="66" width="124" height="10" rx="9" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="76" cy="82" r="6" fill="#FF2D20"/>
    <rect x="96" y="78" width="70" height="8" rx="4" fill="#8C93A1"/>
  </g>

  <g filter="url(#barShadow)">
    <rect x="58" y="104" width="124" height="32" rx="9" fill="url(#bar2)"/>
    <rect x="58" y="104" width="124" height="10" rx="9" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="76" cy="120" r="6" fill="#2ECC71"/>
    <rect x="96" y="116" width="70" height="8" rx="4" fill="#8C93A1"/>
  </g>

  <g filter="url(#barShadow)">
    <rect x="58" y="142" width="124" height="32" rx="9" fill="url(#bar3)"/>
    <rect x="58" y="142" width="124" height="10" rx="9" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="76" cy="158" r="6" fill="#3498DB"/>
    <rect x="96" y="154" width="70" height="8" rx="4" fill="#7B8492"/>
  </g>
</svg>
